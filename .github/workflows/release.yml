name: Release

# Publishes a GitHub Release whenever a push to main carries a VERSION that has no tag yet.
# The release skill (.claude/skills/release) bumps VERSION and writes the CHANGELOG section;
# this workflow builds the signed APK and creates the release from it.
#
# - Tag: the bare version (`1.0.0`). It is created by `gh release create` on the pushed
#   commit, so no manual tagging.
# - Notes: the `## X.Y.Z — date` section of CHANGELOG.md, plus a downloads table and the APK
#   certificate.
# - Idempotent: if the tag already exists the run does nothing, so re-runs, unrelated VERSION
#   edits and several pushes in a row can never release a version twice.
#
# Secrets: ABHANG_KEYSTORE_BASE64 (base64 of abhang-upload.jks), ABHANG_KEYSTORE_PASSWORD,
# ABHANG_KEY_ALIAS, ABHANG_KEY_PASSWORD. app/build.gradle.kts reads the ABHANG_* variables.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every release must be signed by this certificate, or Android refuses to install it as an
  # update. Change it only if the signing key is deliberately replaced.
  EXPECTED_CERT_SHA256: 'a4:b2:1b:19:b7:65:8f:8d:93:ea:dc:3d:64:4c:8d:81:f9:06:8e:78:58:bf:62:22:a1:2c:f3:fb:89:d7:ee:7e'

jobs:
  check:
    # A manual run from another branch must not publish a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::'$version' is not X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Skip if already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.tag.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything between `## X.Y.Z …` and the next `## ` heading, blank edges trimmed.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > changelog-section.md
          if [[ ! -s changelog-section.md ]]; then
            echo "::error file=CHANGELOG.md::no '## $VERSION — YYYY-MM-DD' section (or it is empty)"
            exit 1
          fi
          cat changelog-section.md

      - if: steps.tag.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-section
          path: changelog-section.md

  android:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Same major as Android Studio's bundled JBR, which builds the app locally.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ABHANG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ABHANG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ABHANG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ABHANG_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets are missing; an unsigned APK cannot be released."
            exit 1
          fi
          keystore="$RUNNER_TEMP/abhang-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ABHANG_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # gradlew is committed without the executable bit (the repo was created on Windows).
      - name: Test and build
        env:
          ABHANG_KEYSTORE_PASSWORD: ${{ secrets.ABHANG_KEYSTORE_PASSWORD }}
          ABHANG_KEY_ALIAS: ${{ secrets.ABHANG_KEY_ALIAS }}
          ABHANG_KEY_PASSWORD: ${{ secrets.ABHANG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test assembleRelease

      - name: Verify signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" ]]; then
            echo "::error::$apk was not produced (an unsigned build is named app-release-unsigned.apk)."
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          out="$("$apksigner" verify --print-certs "$apk" 2>&1)" || { echo "$out"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$out" | grep -v '^WARNING:'
          # The line's prefix varies by build-tools version ("Signer #1", "V2 Signer", …), so match on the tail.
          digest="$(echo "$out" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 \
            | tr 'A-F' 'a-f' | sed 's/../&:/g; s/:$//')"
          echo "APK certificate: $digest"
          if [[ "$digest" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is signed by $digest, expected $EXPECTED_CERT_SHA256. Android would refuse it as an update."
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/abhang-$VERSION.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/abhang-upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: abhang-${{ needs.check.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: [check, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and notes
        run: |
          cd artifacts
          apk="abhang-$VERSION.apk"
          sha256sum "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            cat changelog-section.md
            echo
            echo "## Downloads"
            echo
            echo "| File | What |"
            echo "| --- | --- |"
            echo "| \`$apk\` | Android app. Install it over an earlier version to update. |"
            echo "| \`SHA256SUMS.txt\` | Checksum for the APK. |"
            echo
            echo "**APK signing certificate (SHA-256):**"
            echo "\`$EXPECTED_CERT_SHA256\`"
            echo
            echo "Full details are in [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$VERSION/CHANGELOG.md)."
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Abhang $VERSION" \
            --notes-file notes.md \
            "abhang-$VERSION.apk" SHA256SUMS.txt
