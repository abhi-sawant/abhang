<p class="intro">येथे स्वयंचलित दुरुस्ती केलेल्या अभंगांचा यादृच्छिक नमुना आहे (150 / 3756). प्रत्येक अभंग वाचा: शुद्धलेखन बरोबर असेल तर <b>✔ बरोबर</b>, चूक असेल तर <b>✘ चूक</b> दाबून खालच्या पेटीत दुरुस्त मजकूर लिहा. तुमचे उत्तर या ब्राउझरमध्ये आपोआप जतन होते. शेवटी वरील बटणाने निकाल फाइल सेव्ह करा.</p>

१०॥\nमायबाप म्हणे हा चि देव खरा । आणीक पसारा लटिका तो ॥११॥\nतो हि त्यांचा देव दिला नारायणें । माझें हें करणें तो हि मी च ॥१२॥\nमीं च म्हणउनि जें जें जेथें ध्याती । तेथें मी श्रीपति भोगिता तें ॥१३॥\nतें मज वेगळें मी तया निराळा । नाहीं या सकळा ब्रह्मांडांत ॥१४॥\nततभावना तैसें भविष्य तयाचें । फळ देता साचें मी च एक ॥१५॥\nमी च एक खरा बोलें नारायण । दाविलें निर्वाण निजदासां ॥१६॥\nनिजदासां खूण दाविली निरुती । तुका म्हणे भूतीं नारायण ॥१७॥","raw":"भHीसाटीं केली यशोदेसी आळी । थिंकोनिया चोळी डोळे देव ॥१॥\nदेव गिळुनियां धरिलें मोहन । माय ह्मणे कोण येथें दुजें ॥२॥\nदुजें येथें कोणी नाहीं कृष्णाविण । निरुते जाणोन पुसे देवा ॥३॥\nदेवापाशीं पुसे देव काय जाला । हांसें आलें बोला याचें हरि ॥४॥\nयांचे मी जवळी देव तो नेणती । लटिकें मानिती साच खरें ॥५॥\nलटिकें तें साच साच तें लटिके । नेणती लोभिकें आशाबद्ध ॥६॥\nसांग ह्मणे माय येरु वासी तोंड । तंव तें ब्रह्मांड देखे माजी ॥७॥\nमाजी जया चंद्र सूर्य तारांगणें । तो भHांकारणें बाळलीला ॥८॥\nलीळा कोण जाणे याचें महिमान । जगाचें जीवन देवादिदेव ॥९॥\nदेवें कवतुक दाखविलें तयां । लागतील पायां मायबापें ॥१०॥\nमायबाप ह्मणे हा चि देव खरा । आणीक पसारा लटिका तो ॥११॥\nतो हि त्यांचा देव दिला नारायणें । माझें हें करणें तो हि मी च ॥१२॥\nमीं च ह्मणउनि जें जें जेथें ध्याती । तेथें मी श्रीपति भोगिता तें ॥१३॥\nतें मज वेगळें मी तया निराळा । नाहीं या सकळा ब्रह्मांडांत ॥१४॥\nततभावना तैसें भविष्य तयाचें । फळ देता साचें मी च एक ॥१५॥\nमी च एक खरा बोलें नारायण । दाविलें निर्वाण निजदासां ॥१६॥\nनिजदासां खूण दाविली निरुती । तुका ह्मणे भूतीं नारायण ॥१७॥"},{"id":14534,"num":4534,"title":"जाला कवतुक करितां रोकडें","body":"जाला कवतुक करितां रोकडें । आणीक ही पुढें नारायण ॥१॥\nयेउनियां पुढें धरिला मारग । हरावया भाग इंद्रापाशीं॥२॥\nइंद्रा दहीं दुध तूप नेतां लोणी । घेतलें हिरोनि वाटे त्यांचें ॥३॥\nहिरोनि घेतल्या कावडी सकळा । म्हणती गोपाळा बरें नव्हे ॥४॥\nनव्हे तें चि करी न भे किळकाळा । तुका म्हणे लीळा खेळे देव ॥५॥","raw":"जाला कवतुक करितां रोकडें । आणीक ही पुढें नारायण ॥१॥\nयेउनियां पुढें धरिला मारग । हरावया भाग इंद्रापाशीं॥२॥\nइंद्रा दहीं दुध तूप नेतां लोणी । घेतलें हिरोनि वाटे त्यां const KEY="abhang-review-v1";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s);
function summary(){
  const ok=ITEMS.filter(i=>st[i.id]?.s==="ok").length,bad=ITEMS.filter(i=>st[i.id]?.s==="bad").length,done=ok+bad;
  const rate=done?Math.round(bad*100/done):0;
  $("#sum").textContent="तपासले "+done+"/"+ITEMS.length+" · चुकीचे "+bad+(done?" ("+rate+"%)":"");
}
function render(){
  const list=$("#list");list.innerHTML="";
  ITEMS.forEach((it,idx)=>{
    const s=st[it.id]||{};const c=document.createElement("div");c.className="card"+(s.s?" "+s.s:"");
    c.innerHTML='<div class="meta">'+(idx+1)+'. तुकाराम गाथा क्र. '+it.num+'</div><div class="body"></div>'+
      '<div class="row"><button class="ok">✔ बरोबर</button><button class="bad">✘ चूक</button></div>'+
      '<div class="fix" hidden><textarea></textarea></div><details><summary>स्रोतातील मूळ (बिघडलेला) मजकूर</summary><pre></pre></details>';
    $(".body",c).textContent=it.body;$("pre",c).textContent=it.raw;
    const ta=$("textarea",c);ta.value=s.t??it.body;
    const apply=()=>{c.className="card"+(st[it.id]?.s?" "+st[it.id].s:"");$(".ok",c).classList.toggle("on",st[it.id]?.s==="ok");$(".bad",c).classList.toggle("on",st[it.id]?.s==="bad");$(".fix",c).hidden=st[it.id]?.s!=="bad";summary();};
    $(".ok",c).onclick=()=>{st[it.id]={s:"ok"};save();apply()};
    $(".bad",c).onclick=()=>{st[it.id]={s:"bad",t:ta.value};save();apply()};
    ta.oninput=()=>{st[it.id]={s:"bad",t:ta.value};save();};
    list.appendChild(c);apply();
  });
}
$("#export").onclick=()=>{
  const out=ITEMS.filter(i=>st[i.id]?.s).map(i=>({id:i.id,num:i.num,status:st[i.id].s,corrected:st[i.id].s==="bad"?st[i.id].t:undefined}));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download="review_results.json";a.click();
};
render();summary();
</script></body></html>
